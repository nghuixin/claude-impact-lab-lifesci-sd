[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leakprobe"
version = "0.1.0"
description = "Measure proprietary-data leakage into AI models as a 0-100% leak score."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
leakprobe = "leakprobe.cli:main"

[tool.setuptools]
packages = ["leakprobe"]
